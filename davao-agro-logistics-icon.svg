<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#2d5016" stroke-width="4"/>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#f5f5f0"/>
  
  <!-- Mountains -->
  <polygon points="110,80 135,110 85,110" fill="#6b8e23" opacity="0.6"/>
  <polygon points="125,85 150,115 100,115" fill="#8fbc3f" opacity="0.4"/>
  
  <!-- Palm Tree -->
  <line x1="155" y1="90" x2="155" y2="115" stroke="#3d5a1f" stroke-width="2"/>
  <circle cx="155" cy="85" r="8" fill="#2d5016"/>
  <path d="M 155 85 Q 165 75 170 80" fill="#2d5016"/>
  <path d="M 155 85 Q 160 70 165 72" fill="#2d5016"/>
  
  <!-- Road -->
  <path d="M 130 115 Q 145 130 155 140" fill="none" stroke="#c9b898" stroke-width="8"/>
  
  <!-- Truck -->
  <g transform="translate(140, 125)">
    <!-- Truck Body -->
    <rect x="0" y="-8" width="18" height="12" fill="#2d5016" stroke="#1a3a0d" stroke-width="1"/>
    <!-- Truck Cabin -->
    <rect x="16" y="-10" width="8" height="10" fill="#2d5016" stroke="#1a3a0d" stroke-width="1"/>
    <!-- Window -->
    <rect x="17" y="-8" width="6" height="5" fill="#ffffff" opacity="0.7"/>
    <!-- Wheels -->
    <circle cx="4" cy="4" r="2" fill="#1a3a0d"/>
    <circle cx="18" cy="4" r="2" fill="#1a3a0d"/>
    <!-- Refrigeration Symbol -->
    <text x="6" y="-2" font-size="6" fill="#ffffff" text-anchor="middle">❄</text>
  </g>
  
  <!-- Cacao Pod (left side) -->
  <g transform="translate(50, 60)">
    <!-- Pod -->
    <ellipse cx="0" cy="0" rx="8" ry="14" fill="#6b4423" stroke="#3d2817" stroke-width="1"/>
    <!-- Pod segments -->
    <ellipse cx="0" cy="-10" rx="6" ry="4" fill="#d4a574"/>
    <ellipse cx="0" cy="-5" rx="6" ry="4" fill="#d4a574"/>
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="#d4a574"/>
    <ellipse cx="0" cy="5" rx="6" ry="4" fill="#d4a574"/>
    <ellipse cx="0" cy="10" rx="6" ry="4" fill="#d4a574"/>
    <!-- Branch -->
    <line x1="0" y1="-14" x2="-8" y2="-20" stroke="#3d5a1f" stroke-width="2"/>
    <!-- Leaves -->
    <ellipse cx="-12" cy="-22" rx="4" ry="6" fill="#2d5016" transform="rotate(-30 -12 -22)"/>
    <ellipse cx="-8" cy="-18" rx="3" ry="5" fill="#6b8e23" transform="rotate(20 -8 -18)"/>
  </g>
  
  <!-- Text at bottom -->
  <text x="100" y="180" font-size="11" font-weight="bold" fill="#2d5016" text-anchor="middle">DAVAO AGRO-LOGISTICS</text>
  <text x="100" y="192" font-size="7" fill="#2d5016" text-anchor="middle">FROM FARM TO MARKET, MINDANAO STRONG</text>
</svg>